else if(q.mode==='sort')controls=`<p class="qsub">Нажимай на карточки в правильном порядке — они появятся в ответе.</p><div class="sort-row" id="sortingSources">${q.values.map((x,i)=>`<button class="tile" data-sort="${i}">${x}</button>`).join('')}</div><div class="sort-row" id="sortingSlots">${q.values.map(()=>'<span class="slot">?</span>').join('')}</div><div class="quiz-footer"><button class="button light" id="sortReset">↺ Начать заново</button><button class="button primary" id="checkSpecial">Проверить порядок ✓</button></div>`;
else if(q.mode==='draw')controls=`<p class="qsub">Закрась ${q.w*q.h} соседних клеток. Фигура должна быть прямоугольником.</p><div class="drawing-grid" id="drawGrid" aria-label="Поле для рисования: шесть на шесть клеток">${Array.from({length:36},(_,i)=>`<button class="draw-cell" data-cell="${i}" aria-label="Клетка ${Math.floor(i/6)+1}, ${i%6+1}"></button>`).join('')}</div><p class="qsub" id="paintCount">Закрашено: 0 клеток</p><div class="quiz-footer"><button class="button light" id="drawReset">🧽 Очистить</button><button class="button primary" id="checkSpecial">Проверить рисунок ✓</button></div>`;
else if(q.mode==='remainder')controls=`<form class="answer-form" id="remForm"><label>Частное <input id="quotient" type="number" inputmode="numeric" min="0" step="1" required placeholder="Сколько?" style="width:130px"/></label><label>Остаток <input id="remainder" type="number" inputmode="numeric" min="0" step="1" required placeholder="Остаток" style="width:130px"/></label><button class="button primary" type="submit">Проверить ✓</button></form>`;

$('#exitQuiz').onclick=()=>abandonQuiz();$('#hint').onclick=()=>{if(session.answered)return;session.hadHint=true;s.hints++;save();$('#hintText').classList.remove('hidden');$('#hintText').textContent='💡 '+q.hint;$('#hint').disabled=true};
if(q.mode==='number'){$('#answerForm').onsubmit=e=>{e.preventDefault();if($('#numericAnswer').value.trim()!=='')checkAnswer(Number($('#numericAnswer').value))};$('#showPad').onclick=()=>$('#numPad').classList.toggle('hidden');$$('[data-digit]').forEach(b=>b.onclick=()=>{const t=$('#numericAnswer');const dig=b.dataset.digit;if(dig==='OK'){$('#answerForm').requestSubmit();return}if(dig==='⌫')t.value=t.value.slice(0,-1);else t.value+=dig;t.focus()});}

else if(q.mode==='draw'){$$('[data-cell]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cell;let set=session.ui.cells;if(set.has(i))set.delete(i);else set.add(i);b.classList.toggle('on',set.has(i));$('#paintCount').textContent=`Закрашено: ${set.size} клеток`});$('#drawReset').onclick=()=>{session.ui.cells.clear();$$('[data-cell]').forEach(b=>b.classList.remove('on'));$('#paintCount').textContent='Закрашено: 0 клеток'};$('#checkSpecial').onclick=()=>checkAnswer(validateDrawing(q,session.ui.cells))}
else if(q.mode==='remainder'){$('#remForm').onsubmit=e=>{e.preventDefault();checkAnswer([+$('#quotient').value,+$('#remainder').value])}};
}
function updateSort(q){$$('[data-sort]').forEach(b=>b.classList.toggle('used',session.ui.sort.includes(+b.dataset.sort)));$('#sortingSlots').innerHTML=q.values.map((_,i)=>`<button class="slot" data-unsort="${i}" aria-label="Убрать карточку ${i+1}">${session.ui.sort[i]===undefined?'?':q.values[session.ui.sort[i]]}</button>`).join('');$$('[data-unsort]').forEach(b=>b.onclick=()=>{let i=+b.dataset.unsort;session.ui.sort.splice(i,1);updateSort(q)})}
function validateDrawing(q,set){if(set.size!==q.w*q.h)return false;const x=[...set].map(i=>i%6),y=[...set].map(i=>Math.floor(i/6));let minX=Math.min(...x),maxX=Math.max(...x),minY=Math.min(...y),maxY=Math.max(...y);if(maxX-minX+1!==q.w||maxY-minY+1!==q.h)return false;for(let a=minX;a<=maxX;a++)for(let b=minY;b<=maxY;b++)if(!set.has(b*6+a))return false;return true}
function answerText(q){if(q.mode==='draw')return`прямоугольник ${q.w} × ${q.h} клеток`;if(Array.isArray(q.answer))return`${q.answer[0]} (ост. ${q.answer[1]})`;if(q.mode==='sort')return q.answer.replaceAll(',',' → ');return String(q.answer)}
function checkAnswer(given){if(!session||session.answered)return;const q=session.items[session.idx];session.answered=true;const good=q.mode==='draw'?given===true:q.mode==='remainder'?Array.isArray(given)&&given[0]===q.answer[0]&&given[1]===q.answer[1]:String(given)===String(q.answer);s.attempts++;let st=s.zoneStats[session.zone.id]||{ok:0,all:0};st.all++;if(good){st.ok++;s.correct++;s.streak++;session.good++;s.daySolved++;s.bestStreak=Math.max(s.streak,s.bestStreak);let earn=session.hadHint?5:8;if(s.streak%5===0)earn+=5;session.earned+=earn;coins(earn);if(s.correct%8===0){s.tickets++;toast('🎟️ Билет на погоню заработан! Ищи мини-игру в парке!')}if(['equations1','equations2','equations3'].includes(session.zone.topic))s.solvedEquations++;if(!s.dayClaimed&&s.daySolved>=12){s.dayClaimed=true;coins(25);session.earned+=25;toast('🎁 Задание дня выполнено! +25 монет!')}correctTone();if(session.good%5===0)confetti();$('#feedback').textContent=`🎉 Верно! +${earn} 🪙${s.streak%5===0?' (включая бонус за серию)':''}`;$('#feedback').classList.add('good')}
else{s.streak=0;session.errors++;sound(225,.16);$('#feedback').textContent=`🌱 Попробуем запомнить: ответ ${answerText(q)}.`;$('#feedback').classList.add('bad');$('#hintText').classList.remove('hidden');$('#hintText').textContent='💡 Объяснение: '+q.hint}

$('#nextHolder').innerHTML=`<button class="button primary" id="nextQuestion">${session.idx===session.max-1?'🏆 Закончить приключение':'Следующее задание →'}</button>`;$('#nextQuestion').onclick=()=>{session.idx++;renderQuiz()}}
function finishSession(){if(!session)return;endQuizTimer();const d=session;const z=d.zone;const oldBest=s.zoneBest[z.id]||0;const result=d.good;let newBest=0,bonus=0,addStars=0;if(!d.sprint){newBest=Math.max(result,oldBest);s.zoneBest[z.id]=newBest;s.zoneSessions[z.id]=(s.zoneSessions[z.id]||0)+1;let tier=n=>n>=10?3:n>=8?2:n>=6?1:0;addStars=Math.max(0,tier(newBest)-tier(oldBest));s.stars+=addStars;if(result>=8&&oldBest<8){bonus=25;coins(bonus)}else if(result===10){bonus=12;coins(bonus)}}s.quizCount++;save();if(result>=Math.min(6,d.max))confetti();
const badge=result===d.max?'🏆':result>=d.max*.8?'🎖️':result>=d.max*.5?'🌟':'💪';$('#main').innerHTML=`<div class="panel result"><div class="trophy">${badge}</div><h2>${result>=d.max*.8?'Вот это мастерство!':result>=d.max*.5?'Отличная тренировка!':'Ты сделал важный шаг!'}</h2><p class="muted">${esc(z.title)} ${d.sprint?'· Скоростной режим':''}</p><div class="bigscore">${result} / ${d.max}</div><div class="stat-line"><span>🪙 За задания: +${d.earned}</span><span>🎁 Бонус: +${bonus}</span><span>⭐ Новые звёзды: +${addStars}</span><span>✅ Лучшая попытка: ${newBest||oldBest}/10</span></div><p>Твой парк становится больше с каждым заданием! Улыбнись своему любимому зверьку 🐰</p><div class="quiz-footer"><button class="button primary" id="again">🔁 Ещё ${d.max} заданий</button><button class="button sunny" data-go="shop">🛍️ Потратить монетки</button><button class="button light" data-go="yard">🌳 В парк</button><button class="button light" id="toPart">🗺️ К темам</button></div></div>`;$('#again').onclick=()=>startSession(z.id,d.sprint);$('#toPart').onclick=()=>part(z.part);session=null;

}
function startChase(free=false,petId=null){if(!free&&s.tickets<=0){toast('🎟️ Сначала реши ещё задачки, чтобы заработать билет!');return}if(!free){s.tickets--;save()}hideOverlay();pauseChase();endQuizTimer();session=null;view='chase';$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view==='arcade'));window.scrollTo({top:0,behavior:'instant'});
 const pet=PETS.find(x=>x.id===petId)||sample(PETS.filter(x=>s.ownedPets.includes(x.id)));chase={pet,score:0,endAt:Date.now()+20000,timer:null,finished:false,free};
 $('#main').innerHTML=`<div class="panel"><div class="flex spread"><div><span class="eyebrow">Бегущий зверёк</span><h1 style="margin-bottom:6px">🏃 Успей поймать ${esc(pet.name)}!</h1><p class="muted">Нажми на зверька 5 раз. Он каждый раз побежит на новое место!</p></div><span class="meter" id="chaseTimer">⏱️ 20 сек</span></div><div class="chase-field" id="chaseField"><span class="park-cloud" style="--left:12%;--time:8s">☁️</span><span class="park-cloud" style="--left:67%;--time:10s">☁️</span><button class="runner" id="chaseRunner" aria-label="Поймать зверька" style="--x:20%;--y:40%">${pet.e}</button></div><div class="progress-duo"><span class="meter" id="chaseScore">🐾 Поймано: 0/5</span><button class="button light" id="chaseExit">Закончить погоню</button></div></div>`;
 const run=$('#chaseRunner');run.onclick=()=>{if(!chase||chase.finished)return;chase.score++;s.catches++;coins(3);sound(730,.10);$('#chaseScore').textContent=`🐾 Поймано: ${chase.score}/5`;run.style.setProperty('--x',`${rand(5,75)}%`);run.style.setProperty('--y',`${rand(14,70)}%`);if(chase.score>=5)endChase(true)};
 $('#chaseExit').onclick=()=>endChase(false);
 chase.timer=setInterval(()=>{if(!chase||chase.finished)return;const left=Math.max(0,Math.ceil((chase.endAt-Date.now())/1000));if($('#chaseTimer'))$('#chaseTimer').textContent=`⏱️ ${left} сек`;if(left<=0){endChase(false);return}if($('#chaseRunner')){$('#chaseRunner').style.setProperty('--x',`${rand(5,75)}%`);$('#chaseRunner').style.setProperty('--y',`${rand(14,70)}%`)}},1000)
}
function endChase(won){if(!chase||chase.finished)return;chase.finished=true;const {score,pet}=chase;clearInterval(chase.timer);if(won){coins(12);confetti()}save();chase=null;
 $('#main').innerHTML=`<div class="panel result"><div class="trophy">${won?'🏆':'🐾'}</div><h2>${won?'Ура! Ты догнал зверька!':'Весёлая прогулка закончилась!'}</h2><p>${pet.e} ${esc(pet.name)} вернулся в парк и машет тебе лапкой!</p><div class="bigscore">${score}/5</div><p>🪙 Ты заработал ${score*3+(won?12:0)} монеток.</p><div class="quiz-footer"><button class="button primary" data-go="yard">🌳 Вернуться в парк</button><button class="button light" data-go="arcade">🎮 Мини-игры</button><button class="button sunny" data-go="shop">🛍️ Магазин</button></div></div>`
}
function renderStats(){const stat=(icon,name,n)=>`<div class="stat"><div style="font-size:31px">${icon}</div><strong>${fmt(n)}</strong><span>${name}</span></div>`;
 const badges=[['🐣','Первый шаг',s.correct>=1],['🐻','Знаток десятков',progressPart(PARTS[0])>=4],['🐝','Мастер фигур',progressPart(PARTS[1])>=4],['🐲','Чемпион острова',progressPart(PARTS[2])>=7],['📚','100 ответов',s.correct>=100],['⚡','Серия из 10',s.bestStreak>=10],['🪙','Коллекционер монет',s.earned>=500],['🐾','Друзья навсегда',s.ownedPets.length>=5],['🌷','Ландшафтный мастер',s.ownedDecor.length>=5],['🧠','Хранитель уравнений',s.solvedEquations>=30],['🏃','Ловец зверят',s.catches>=15],['🏅','Все темы',ZONES.every(z=>progress(z)>=6)]];
 $('#main').innerHTML=`<div><span class="eyebrow">Твои маленькие и большие победы</span><h1>🏆 Мои достижения</h1><p class="muted">Смотри, сколько ты уже умеешь. Учиться можно в любом темпе!</p></div><div class="statsgrid">${stat('✅','Правильных ответов',s.correct)}${stat('🪙','Всего заработано',s.earned)}${stat('⭐','Звёзд',s.stars)}${stat('🧩','Решено заданий',s.attempts)}${stat('🔥','Рекорд серии',s.bestStreak)}${stat('🐾','Питомцев',s.ownedPets.length)}${stat('🏃','Поймано зверят',s.catches)}${stat('💡','Взято подсказок',s.hints)}</div><div class="panel"><h2>🗺️ Мои три части</h2>${PARTS.map(p=>`<div class="progress-item" style="display:grid;grid-template-columns:minmax(0,1fr) 190px 50px;gap:9px;align-items:center;margin:15px 0"><b>${p.emoji} Часть ${p.id}: ${p.title}</b><div class="bar" style="margin:0"><i style="width:${100*progressPart(p)/p.zones.length}%"></i></div><b>${progressPart(p)}/${p.zones.length}</b></div>`).join('')}</div><div class="panel" style="margin-top:17px"><h2>🎖️ Коллекция наград</h2><div class="badges">${badges.map(([em,label,unlocked])=>`<div class="achievement ${unlocked?'':'lock'}"><span class="symbol">${em}</span><b>${label}</b><div class="muted" style="font-size:12px">${unlocked?'✅ Получено':'🔒 Ещё впереди'}</div></div>`).join('')}</div></div><div class="intro-box" style="margin-top:19px">💾 Прогресс хранится в браузере этого устройства. Если очистить данные сайтов, покупки и результаты могут исчезнуть.</div><div class="flex" style="margin-top:17px"><button class="button danger" id="resetBtn">🗑️ Сбросить игровой прогресс</button></div>`;
 $('#resetBtn').onclick=showReset;
}
function showReset(){const root=$('#overlay');root.classList.remove('hidden');root.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="Подтверждение сброса"><div class="art">🦉</div><h2>Точно начать всё заново?</h2><p>Монетки, купленные зверята, украшения и результаты будут удалены на этом устройстве. Вернуть их не получится.</p><div class="quiz-footer"><button class="button danger" id="resetYes">Да, сбросить всё</button><button class="button primary" id="resetNo">Нет, сохранить</button></div></div>`;$('#resetNo').onclick=hideOverlay;$('#resetYes').onclick=()=>{s=JSON.parse(JSON.stringify(INITIAL));s.day=today();save();hideOverlay();navigate('home');toast('Начинаем с чистого листа! 🐣')}}
function render(){header();if(view==='home')renderHome();else if(view==='part')renderPart();else if(view==='shop')renderShop();else if(view==='yard')renderYard();else if(view==='arcade')renderArcade();else if(view==='stats')renderStats();}
function routeGo(go){if(go==='part1')part(1);else if(go.startsWith('part')&&/^part[123]$/.test(go))part(Number(go.slice(-1)));else if(['home','shop','yard','arcade','stats'].includes(go))navigate(go)}
document.addEventListener('click',ev=>{const go=ev.target.closest('[data-go]');if(go){routeGo(go.dataset.go);return}const p=ev.target.closest('[data-part]');if(p){part(Number(p.dataset.part));return}const z=ev.target.closest('[data-zone]');if(z){startSession(z.dataset.zone);return}const nav=ev.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}});
$('#sound').onclick=()=>{s.sound=!s.sound;save();toast(s.sound?'🔊 Звуки включены':'🔇 Звуки выключены')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').classList.contains('hidden')){hideOverlay();if(view==='yard')renderYard()}});
header();render();
</script></body></html>
